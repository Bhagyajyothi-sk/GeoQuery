[pytest]
# Run from the project root:  python -m pytest
testpaths = backend/tests

# Make the `app` package importable (backend/ is the package root).
# backend/tests/conftest.py sets this up too, so pytest < 7 still works.
pythonpath = backend

addopts = -v --strict-markers

markers =
    integration: requires the RemoteCLIP checkpoint and heavy ML dependencies (torch, open-clip-torch)

filterwarnings =
    ignore::DeprecationWarning
